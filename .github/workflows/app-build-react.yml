name: Template - App Build React

on:
  workflow_call:
    inputs:
      node_version:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
        description: artifact name

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ui_artifact_name: ${{ steps.output-artifact-names.outputs.ui_artifact_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Install Dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Build Next React App
        run: ${{ steps.detect-package-manager.outputs.runner }} next build

      - name: Upload app artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: ${{ inputs.artifact_name }}
          if-no-files-found: error
          path: .

      - name: Set artifact name environment variables
        if: ${{ github.event_name != 'pull_request' }}
        id: output-artifact-names
        run: |
          echo "ui_artifact_name=${{ inputs.artifact_name }}" >> $GITHUB_OUTPUT